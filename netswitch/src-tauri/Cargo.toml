[package]
name = "netswitch"
version = "0.1.0"
description = "Gestionnaire de profils réseau (barre des menus / zone de notification)"
authors = ["Elon Hayot"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dns-lookup = "2"

[profile.release]
strip = true
lto = true
opt-level = "s"
