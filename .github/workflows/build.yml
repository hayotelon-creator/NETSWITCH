name: Build NetSwitch

on:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: netswitch

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
            args: --target universal-apple-darwin
          - os: windows-latest
            name: windows
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: netswitch/src-tauri

      - run: npm install
      - run: npx tauri icon src-tauri/app-icon.png
      - run: npx tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: NetSwitch-${{ matrix.name }}
          path: |
            netswitch/src-tauri/target/**/release/bundle/dmg/*.dmg
            netswitch/src-tauri/target/**/release/bundle/nsis/*.exe
